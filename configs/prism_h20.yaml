# nanyang-Prism-Max-H2.0 配置文件
# 用于 generate.py --config 加载模型参数，或作为参考

self_dit:
  in_channels: 4
  dim: 768
  depth: 16
  heads: 12
  patch_size: 2
  text_dim: 512
  max_t: 64      # 最长支持 64 tokens × (patch_size²) ≈ 32 秒 @ 12fps
  max_h: 64      # H ≤ 64×patch_size = 128px；推理时会按此缩放
  max_w: 64
  mlp_ratio: 4.0

self_vae:
  in_channels: 3
  latent_channels: 4
  base_ch: 128
  spatial_down: 8
  max_frames: 256

text_encoder:
  dim: 512
  depth: 4
  heads: 4
  max_len: 128   # token 序列最大长度

sampling:
  num_steps: 28
  cfg_scale: 3.5
  seed: null

output:
  default_size: [1024, 1024]
  default_duration_s: 30.0
  default_fps: 12
  cache_dir: ~/.cache/nanyang-prism-h20
