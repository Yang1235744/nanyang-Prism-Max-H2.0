# nanyang-Prism-Max-H2.0 配置文件
# 用于 generate.py --config 加载模型参数，或作为参考

self_dit:
  in_channels: 4
  dim: 768
  depth: 16
  heads: 12
  patch_size: 2
  text_dim: 512
  max_t: 64      # 单次推理最大帧数（chunked sampling；30s@12fps 分 ~5 次推理拼接）
  max_h: 64      # latent 空间空间 token 上限（H/p ≤ 64 → 原图最大 ~512px；高分辨率需增大此值）
  max_w: 64
  mlp_ratio: 4.0

self_vae:
  in_channels: 3
  latent_channels: 4
  base_ch: 128
  spatial_down: 8
  max_frames: 256

text_encoder:
  dim: 512
  depth: 4
  heads: 4
  max_len: 128   # token 序列最大长度

sampling:
  num_steps: 28
  cfg_scale: 3.5
  seed: null

output:
  default_size: [1024, 1024]
  default_duration_s: 30.0
  default_fps: 12
  cache_dir: ~/.cache/nanyang-prism-h20
